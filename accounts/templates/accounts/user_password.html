{% extends "base.html" %}
{% block title %}كلمة مرور {{ target.username }}{% endblock %}
{% block content %}
<div class="card" style="max-width:520px">
  <h1>تغيير كلمة مرور <span class="ltr">{{ target.username }}</span></h1>
  <form method="post" novalidate>{% csrf_token %}
    {{ form.non_field_errors }}
    {% for f in form %}{% include "reports/_field.html" with f=f %}{% endfor %}
    <button class="btn">حفظ</button>
    <a class="btn secondary" href="{% url 'accounts:list' %}">إلغاء</a>
  </form>
</div>
{% endblock %}
