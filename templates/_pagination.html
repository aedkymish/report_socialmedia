{% if is_paginated %}<nav class="pagination" aria-label="الصفحات">
  {% if page_obj.has_previous %}<a href="?{% if query %}{{ query }}&{% endif %}page={{ page_obj.previous_page_number }}">السابق</a>{% endif %}
  <span>صفحة {{ page_obj.number }} من {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?{% if query %}{{ query }}&{% endif %}page={{ page_obj.next_page_number }}">التالي</a>{% endif %}
</nav>{% endif %}
