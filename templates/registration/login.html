{% extends "base.html" %}
{% load ui %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="logo"><span class="brand-mark" style="width:64px;height:64px;border-radius:16px;background:var(--brand-50)">{% icon "shield" 34 %}</span></div>
    <h1>تسجيل الدخول</h1>
    <p class="sub">استخدم الكود الخاص بك كاسم مستخدم.</p>
    {% if form.errors %}<ul class="messages"><li class="error">الكود أو كلمة المرور غير صحيحة.</li></ul>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="field"><label for="id_username">الكود</label>
        <input type="text" name="username" id="id_username" dir="ltr" autofocus required autocomplete="username"></div>
      <div class="field"><label for="id_password">كلمة المرور</label>
        <input type="password" name="password" id="id_password" required autocomplete="current-password"></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn lg" style="width:100%">دخول</button>
    </form>
  </div>
</div>
{% endblock %}
