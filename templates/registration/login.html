{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h1>تسجيل الدخول</h1>
  <p class="muted">استخدم الكود الخاص بك كاسم مستخدم.</p>
  {% if form.errors %}<ul class="errorlist"><li>الكود أو كلمة المرور غير صحيحة.</li></ul>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="field"><label for="id_username">الكود</label>
      <input type="text" name="username" id="id_username" dir="ltr" autofocus required></div>
    <div class="field"><label for="id_password">كلمة المرور</label>
      <input type="password" name="password" id="id_password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn">دخول</button>
  </form>
</div>
{% endblock %}
