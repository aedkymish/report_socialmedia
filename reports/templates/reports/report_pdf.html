<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تقرير طلبات الإجراء</title>
<style>
  {{ font_css|safe }}
  /* same design system as the screen */
  {{ app_css|safe }}
  /* PDF-specific overrides */
  :root { --font:"ReportSans", sans-serif; }
  @page { size:A4; margin:14mm 12mm 16mm; }
  body { background:#fff; font-size:10.5pt; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .card { border:0; box-shadow:none; padding:0; margin:0 0 12px; }
  .form-head.with-logo { display:block; }
  .form-head .head-logo { display:flex; justify-content:center; margin:0 auto 3mm; }
  .form-head .head-logo img { max-width:60mm; }
  .form-head .head-spacer { display:none; }
  .tiles { grid-template-columns:repeat(5,1fr); gap:8px; }
  .tile { padding:8px 10px; }
  .tile .num { font-size:17pt; }
  .tile .lbl { font-size:8.5pt; }
  .charts { grid-template-columns:1fr 1fr; gap:10px; }
  .chart { break-inside:avoid; }
  table { font-size:9pt; }
  th, td { padding:6px 7px; }
  thead { display:table-header-group; }
  tr { break-inside:avoid; }
  .table-wrap { overflow:visible; }
  table { table-layout:fixed; }
  td { overflow-wrap:anywhere; }
  th:nth-child(1), td:nth-child(1) { width:5%; }
  th:nth-child(2), td:nth-child(2) { width:14%; white-space:normal !important; }
  th:nth-child(5), td:nth-child(5) { width:8%; }
  th:nth-child(6), td:nth-child(6) { width:10%; }
  th:nth-child(7), td:nth-child(7) { width:14%; }
  th:nth-child(8), td:nth-child(8) { width:11%; }
  th { white-space:normal; }
  .tags { gap:3px; }
  .tag { padding:0 6px; font-size:7.5pt; white-space:normal; }
  .tag .icon { width:11px; height:11px; }
  .badge { white-space:normal; border-radius:6px; line-height:1.4; padding:2px 6px; }
  .badge { font-size:8pt; }
  .badge::before { display:none; }
</style>
</head>
<body>
{% if watermark %}{% include "ui/watermark.html" with src=logo opacity=watermark_opacity %}{% endif %}
{% with f=result.filter %}
{% include "reports/_report_body.html" %}
{% endwith %}
</body>
</html>
