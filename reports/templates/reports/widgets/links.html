{% load ui %}<div class="links-widget" data-name="{{ widget.name }}" data-check-url="{% url 'reports:link_check' %}">
  <div class="links-rows">
    {% for v in widget.rows %}
    <div class="link-row">
      <span class="link-num">{{ forloop.counter }}</span>
      <input type="url" name="{{ widget.name }}" value="{{ v }}" dir="ltr" placeholder="https://..." autocomplete="off" aria-label="رابط">
      <span class="link-platform"></span>
      <button type="button" class="link-remove" title="حذف الرابط" aria-label="حذف الرابط">{% icon "x" 16 %}</button>
      <div class="link-dup" role="alert" hidden></div>
    </div>
    {% endfor %}
  </div>
  <div class="links-actions">
    <button type="button" class="btn small secondary link-add">{% icon "plus" 15 %}إضافة رابط</button>
    <span class="muted link-count"></span>
  </div>
</div>
<script>
(function () {
  const root = document.currentScript.previousElementSibling;
  const rows = root.querySelector('.links-rows');
  const ICONS = {% platform_icons_json %};
  const PLATFORMS = [
    [/(^|\.)tiktok\.com$/, 'tiktok', 'تيك توك'], [/(^|\.)(facebook\.com|fb\.watch|fb\.com)$/, 'facebook', 'فيسبوك'],
    [/(^|\.)(t\.me|telegram\.me)$/, 'telegram', 'تلغرام'], [/(^|\.)instagram\.com$/, 'instagram', 'إنستغرام'],
    [/(^|\.)(x\.com|twitter\.com)$/, 'x', 'إكس'],
  ];
  function platformOf(v) {
    if (!v) return '';
    try { const h = new URL(/^https?:\/\//i.test(v) ? v : 'https://' + v).hostname.toLowerCase();
          for (const [re, key, label] of PLATFORMS) if (re.test(h)) return ICONS[key] + '<span>' + label + '</span>';
          return ICONS.other + '<span>أخرى</span>';
    } catch (e) { return '<span style="color:var(--bad)">⚠ غير صالح</span>'; }
  }
  const checkUrl = root.dataset.checkUrl;
  const cache = new Map();
  async function checkDuplicate(row) {
    const input = row.querySelector('input'), box = row.querySelector('.link-dup');
    const v = input.value.trim();
    box.hidden = true; box.innerHTML = ''; row.classList.remove('is-dup');
    if (!v) return;
    const inputs = [...rows.querySelectorAll('.link-row input')];
    const earlier = inputs.slice(0, inputs.indexOf(input)).some(i => i.value.trim().toLowerCase() === v.toLowerCase());
    if (earlier) { box.textContent = 'هذا الرابط مكرر في هذا الطلب وسيُتجاهل.'; box.hidden = false; row.classList.add('is-dup'); return; }
    try {
      if (!cache.has(v)) cache.set(v, fetch(checkUrl + '?url=' + encodeURIComponent(v), {credentials: 'same-origin'}).then(r => r.json()));
      const res = await cache.get(v);
      if (input.value.trim() !== v || !res.duplicate) return;
      box.innerHTML = 'الرابط مسجّل مسبقاً في <a target="_blank" href="' + res.href + '">الطلب رقم ' + res.request + '</a> (' + res.status + ') — لن يُقبل الطلب به.';
      box.hidden = false; row.classList.add('is-dup');
    } catch (e) { /* offline: the server still validates on submit */ }
  }
  const checkAll = () => rows.querySelectorAll('.link-row').forEach(checkDuplicate);
  rows.addEventListener('change', e => { const r = e.target.closest('.link-row'); if (r) checkAll(); });
  function refresh() {
    const all = [...rows.querySelectorAll('.link-row')];
    let filled = 0;
    all.forEach((r, i) => {
      const v = r.querySelector('input').value.trim();
      if (v) filled++;
      r.querySelector('.link-num').textContent = i + 1;
      r.querySelector('.link-platform').innerHTML = platformOf(v);
    });
    root.querySelector('.link-count').textContent = filled ? `عدد الروابط: ${filled}` : '';
  }
  function addRow(value, after) {
    const tpl = rows.querySelector('.link-row').cloneNode(true);
    const input = tpl.querySelector('input'); input.value = value || '';
    after ? after.after(tpl) : rows.appendChild(tpl);
    refresh(); return input;
  }
  root.querySelector('.link-add').addEventListener('click', () => addRow('').focus());
  rows.addEventListener('click', e => {
    const btn = e.target.closest('.link-remove'); if (!btn) return;
    const row = btn.closest('.link-row');
    if (rows.querySelectorAll('.link-row').length > 1) row.remove();
    else row.querySelector('input').value = '';
    refresh(); checkAll();
  });
  rows.addEventListener('input', refresh);
  rows.addEventListener('keydown', e => {           // Enter = new row instead of submitting
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
      e.preventDefault(); addRow('', e.target.closest('.link-row')).focus();
    }
  });
  rows.addEventListener('paste', e => {             // paste many URLs -> many rows
    const text = (e.clipboardData || window.clipboardData).getData('text');
    const urls = text.split(/[\s,،]+/).map(s => s.trim()).filter(Boolean);
    if (urls.length < 2) return;
    e.preventDefault();
    let row = e.target.closest('.link-row');
    const input = row.querySelector('input');
    if (!input.value.trim()) { input.value = urls.shift(); }
    for (const u of urls) row = addRow(u, row).closest('.link-row');
    refresh(); checkAll();
  });
  refresh(); checkAll();
})();
</script>
