<style>
  .chips { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .chips label { cursor:pointer; white-space:nowrap; }
  .report-filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px 20px; }
  .report-filters fieldset { border:0; padding:0; margin:0; }
  .report-filters legend { font-weight:600; margin-bottom:4px; }
  .report-filters input[type=date] { padding:7px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .tile { border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:#fff; }
  .tile .num { font-size:1.8rem; font-weight:700; line-height:1.2; }
  .tile .lbl { color:var(--muted); font-size:.9rem; }
  .charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }

  .bar-track { height:14px; background:transparent; border-bottom:1px solid var(--line); display:block; }
  .bar-fill { display:block; height:14px; background:var(--brand); border-radius:4px 0 0 4px; min-width:2px; }

  table thead { display:table-header-group; }
  table tr { break-inside:avoid; }

</style>
