services:
  web:
    build: .
    image: report-socialmedia:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - app_data:/app/data          # SQLite DB + downloaded videos + screenshots
      # - ./cookies.txt:/app/cookies.txt:ro   # optional, for login-walled platforms
    restart: unless-stopped
    shm_size: "1gb"                 # Chromium needs more than Docker's 64MB default

volumes:
  app_data:
