services:
  web:
    build: .
    image: report-socialmedia:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - app_data:/app/data          # SQLite DB + downloaded videos + screenshots
      - ./cookies:/app/cookies:ro   # put your cookies export (.txt/.json) here — never baked into the image
    restart: unless-stopped
    shm_size: "1gb"                 # Chromium needs more than Docker's 64MB default

volumes:
  app_data:
